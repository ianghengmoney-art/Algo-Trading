name: CI

# A pull-request branch would otherwise run twice for one commit, once for
# each event. Direct pushes are covered on the default branch; everything else
# is covered by the pull_request event.
on:
  push:
    branches: [main]
  pull_request:

# Read-only: this workflow builds and tests, and has no reason to write to the
# repository. Prime Directive 1 applies to the pipeline as much as the code.
permissions:
  contents: read

# A new push supersedes the run still going for the previous commit on the same
# ref, rather than leaving both to finish and race to report.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      # Run first and on its own so a violation is legible in the log as what
      # it is -- an execution library reaching the dependency tree -- rather
      # than as one failure among a hundred. The environment check in this
      # file is stricter in CI than locally, because CI installs only what
      # pyproject.toml declares.
      - name: Prime Directive 1 -- no execution capability
        run: pytest tests/test_prime_directives.py -v

      - name: Tests
        run: pytest -q

      - name: Lint
        run: |
          pip install pyflakes
          pyflakes gcfp qc_algorithm tests

      # The Section 17 probe against the offline fixture set. It exercises the
      # coverage machinery itself, which is the part a broken adapter would
      # silently take down.
      - name: Section 17 coverage probe (fixtures)
        run: gcfp coverage --adapter fixtures
